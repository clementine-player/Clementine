[project]
name = "clementine-remote"
version = "0.1.0"
description = "Command line client for Clementine's network remote, including remote playback"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    # grpcio-tools bundles protoc, used to compile the remote's .proto at runtime.
    "grpcio-tools>=1.66",
    "httpx>=0.27",
    "protobuf>=5.28",
]

[project.scripts]
clementine-remote = "clementine_remote.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
