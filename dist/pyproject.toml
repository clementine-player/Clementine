# For release_notes.py, sentry_symbols.py and their tests: the other scripts
# here aren't checked.
[project]
name = "clementine-release-notes"
version = "0.1.0"
description = "Plans Clementine's numbered releases, and checks and uploads their debug symbols"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned, so CI and local runs agree on what counts as an error.
    "ruff==0.16.9",
    "ty==0.0.84",
]
# For sentry_symbols.py in the macOS and Windows builds, without the rest.
sentry = ["sentry-cli==3.8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_release_notes.py", "test_sentry_symbols.py"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = [
    "release_notes.py",
    "test_release_notes.py",
    "sentry_symbols.py",
    "test_sentry_symbols.py",
]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "ANN",          # every function fully annotated
    "DTZ",          # naive datetimes
    "PYI",          # typing conventions
    "PLC0415",      # imports at the top of the file, not inside functions
    "RUF",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false

[tool.ty.src]
include = [
    "release_notes.py",
    "test_release_notes.py",
    "sentry_symbols.py",
    "test_sentry_symbols.py",
]

[tool.ty.terminal]
error-on-warning = true
