name: Report an issue
description: Something in Clementine isn't working as expected
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I checked the issue tracker for similar issues
          required: true
        - label: I checked the [changelog](https://github.com/clementine-player/Clementine/blob/master/Changelog) to see if the issue is already resolved
          required: true
        - label: I tried the latest Clementine build from [here](https://builds.clementine-player.org/)
          required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Fedora 44
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clementine version
      description: Shown in Help → About Clementine.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected behaviour / actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce the problem (only for bugs)
