          libsparsehash-dev
          libsqlite3-dev
          libtag1-dev
          pkg-config
          protobuf-compiler
          qtbase5-dev
          qttools5-dev-tools
          qttools5-dev
          ssh
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: cmake
        working-directory: bin
        run: >
          cmake ..
          -DWITH_DEBIAN=ON
          -DDEB_ARCH=amd64
          -DDEB_DIST=bookworm
          -DENABLE_SPOTIFY_BLOB=OFF
      - name: make
        working-directory: bin
        run : make -j2 deb
      - uses: actions/upload-artifact@v4
        with:
          name: release_bookworm_64
          path: bin/clementine_*.deb

