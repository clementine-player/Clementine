          libxcb1-dev
          pkg-config
          protobuf-compiler
          qt6-base-dev
          qt6-base-private-dev
          qt6-l10n-tools
          qt6-tools-dev
          qt6-tools-dev-tools
          ssh
          # liblastfm and libmygpo-qt: see the note in push_translations
          # above.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: cmake
        working-directory: bin
        run: >
          cmake ..
          -DWITH_DEBIAN=ON
          -DDEB_ARCH=amd64
          -DDEB_DIST=bookworm
          -DENABLE_SPOTIFY_BLOB=OFF
      - name: make
        working-directory: bin
        run : make -j2 deb
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release_bookworm_64
          path: bin/clementine_*.deb

