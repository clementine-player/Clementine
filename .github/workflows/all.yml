name: all
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install clang-format
        # clementine-player/clang-format-lint-action only bundles clang-format
        # up to v9, which disagrees with newer versions (eg. the one Homebrew
        # ships) on some formatting decisions. Pin to a specific pip-published
        # version instead, and match it locally for the same output as this
        # job - see dist/format.py.
        run: pip install clang-format==23.1.0
      - name: clang-format
        run: |
          find src -type f \( -name '*.c' -o -name '*.h' -o -name '*.C' -o -name '*.H' \
              -o -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.hh' \
              -o -name '*.c++' -o -name '*.h++' -o -name '*.cxx' -o -name '*.hxx' \) -print0 \
            | xargs -0 clang-format \
                -style="{BasedOnStyle: Google, DerivePointerBinding: false, Standard: Cpp11}" \
                --dry-run --Werror


  push_translations:
    name: Push translation sources to Transifex
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - uses: supplypike/setup-bin@v3
        with:
          uri: https://github.com/transifex/cli/releases/download/v1.6.17/tx-linux-amd64.tar.gz
          name: tx
          version: 1.6.17
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y
          build-essential
          cmake
          gettext
          git
          libasound2-dev
          libboost-dev
          libcdio-dev
          libchromaprint-dev
          libdbus-1-dev
          libfftw3-dev
          libgl1-mesa-dev
          libglew-dev
          libglib2.0-dev
          libglx-dev
          libgpod-dev
          libgstreamer-plugins-base1.0-dev
          libgstreamer1.0-dev
          libmtp-dev
          libprotobuf-dev
          libpulse-dev
          libqt6core5compat6-dev
          libqt6opengl6-dev
          libsqlite3-dev
          libtag1-dev
          libx11-dev
          libxcb1-dev
          pkg-config
          protobuf-compiler
          python3-pip
          qt6-base-dev
          qt6-base-private-dev
          qt6-l10n-tools
          qt6-tools-dev
          qt6-tools-dev-tools
          libsparsehash-dev
          ssh
          # liblastfm isn't a dependency any more - Last.fm scrobbling talks
          # directly to the web service API now (see
          # src/internet/lastfm/lastfmws.*). libmygpo-qt still has no Qt6
          # build anywhere, so gpodder sync falls back to the vendored
          # 3rdparty/libmygpo-qt5 copy instead.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: tx init
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx init
      - name: cmake
        working-directory: bin
        run: cmake ..
      - name: make
        working-directory: bin
        run: make -j2
      - name: tx config
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx add --organization davidsansome --project clementine --resource clementineplayer --file-filter 'src/translations/<lang>.po' --type PO src/translations/en.po
      - name: tx push
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx push -s

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    needs:
      - build_bookworm_64
      - build_trixie_64
      - build_fedora_42
      - build_fedora_43
      - build_fedora_44
      - build_jammy_64
      - build_noble_64
      - build_resolute_64
      - build_mac
      - build_mingw
      - build_source
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release_artifacts
      - name: Create draft pre-release
        id: tag_name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=$(echo release_artifacts/**/*.tar.xz | sed -e 's/.*clementine-\(.*\).tar.xz/\1/')
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create draft pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.tag_name.outputs.version }}
          tag_name: ${{ steps.tag_name.outputs.version }}
          files: "release_artifacts/**/*"
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  build_source:
    name: Build source tarball
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y
          cmake
          fakeroot
          gettext
          git
          libasound2-dev
          libboost-dev
          libboost-serialization-dev
          libcdio-cdda2
          libcdio-dev
          libchromaprint-dev
          libcrypto++-dev
          libdbus-1-dev
          libfftw3-dev
          libgl1-mesa-dev
          libglew-dev
          libglx-dev
          libgpod-dev
          libgstreamer-plugins-base1.0-dev
          libgstreamer1.0-dev
          libmtp-dev
          libplist-dev
          libprotobuf-dev
          libpulse-dev
          libqt6core5compat6-dev
          libqt6opengl6-dev
          libsparsehash-dev
          libsqlite3-dev
          libtag1-dev
          libusbmuxd-dev
          libx11-dev
          libxcb1-dev
          protobuf-compiler
          qt6-base-dev
          qt6-base-private-dev
          qt6-l10n-tools
          qt6-tools-dev
          qt6-tools-dev-tools
          ssh
          # QCA is unused by CMakeLists.txt (dead dependency). liblastfm and
          # libmygpo-qt: see the note in push_translations above.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: cmake
        working-directory: bin
        run: cmake ..
      - name: Build source tarball
        working-directory: bin
        run: ../dist/maketarball.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release_source
          path: bin/clementine-*.tar.xz

  build_fedora_42:
    name: Build Fedora 42 RPM
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    env:
      RPM_BUILD_NCPUS: "2"
    steps:
      - name: Install dependencies
        run: >
          dnf install --assumeyes
          @development-tools
          alsa-lib-devel
          boost-devel
          cmake
          cryptopp
          cryptopp-devel
          dbus-devel
          desktop-file-utils
          fftw-devel
          gcc-c++
          gettext
          git
          glew-devel
          gstreamer1-devel
          gstreamer1-plugins-base-devel
          hicolor-icon-theme
          libappstream-glib
          libcdio-devel
          libchromaprint-devel
          libgpod-devel
          libmtp-devel
          libnotify-devel
          libX11-devel
          libxcb-devel
          mesa-libGL-devel
          openssh
          pkgconfig
          protobuf-compiler
          protobuf-devel
          pulseaudio-libs-devel
          qt6-linguist
          qt6-qt5compat-devel
          qt6-qtbase-devel
          qt6-qtbase-private-devel
          qt6-qttools-devel
          qt6-rpm-macros
          qtsingleapplication-qt6-devel
          qtsinglecoreapplication-qt6-devel
          rpmdevtools
          sparsehash-devel
          sqlite-devel
          taglib-devel
          tar
          # liblastfm isn't a dependency any more (see the note in
          # push_translations above), and the QCA qt5 plugins were unused
          # dead weight in this list already.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: cmake
        working-directory: bin
        run: cmake -DUSE_SYSTEM_QTSINGLEAPPLICATION=On ..
      - name: Build source tarball
        working-directory: bin
        run: ../dist/maketarball.sh
      - name: Create rpmbuild directory
        run: mkdir -p ~/rpmbuild/SOURCES
      - name: Move source tarball
        working-directory: bin
        run: mv clementine-*.tar.xz ~/rpmbuild/SOURCES
      - name: Build RPM
        working-directory: bin
        run: rpmbuild -ba ../dist/clementine.spec
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release_fedora_42
          path: ~/rpmbuild/RPMS/*/clementine-*.rpm

