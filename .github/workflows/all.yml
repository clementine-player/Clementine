  build_mac:
    name: Build Mac DMG
    runs-on: macos-26
    # id-token: write is what lets the "Authenticate to GCP" step below
    # trade a GitHub OIDC token for short-lived GCP credentials (Workload
    # Identity Federation, no static key involved) - see
    # dist/CODE_SIGNING.md.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # liblastfm is no longer a dependency at all: Last.fm scrobbling talks
      # directly to the web service API now (src/internet/lastfm/lastfmws.*),
      # so the tomahawk-player/tomahawkqt5 tap this job used to pull a
      # Qt5-linked liblastfm from isn't needed any more either.
      - name: Install dependencies
        run: brew bundle

      # Real Developer ID signing runs for pushes to master (release builds)
      # and for PRs opened from branches *within this repo* - so the
      # signing path itself is testable pre-merge, not just after landing
      # on master. Fork PRs are excluded: github.repository (used by the
      # WIF trust policy in dist/gcp_iam_setup.sh) is always the base repo
      # for pull_request events, even from forks, so that alone can't tell
      # them apart - head.repo.full_name is the field that actually
      # reflects fork vs. same-repo, and it comes from GitHub's own event
      # data, not anything a PR author controls. See dist/CODE_SIGNING.md
      # for the one-time setup this depends on.
      - name: Check signing eligibility
        id: signing
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]] \
            || [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to GCP
        if: steps.signing.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          # Fill in after running dist/gcp_iam_setup.sh (it prints this).
          workload_identity_provider: projects/611551928920/locations/global/workloadIdentityPools/github-actions/providers/clementine-mac-signing
          service_account: mac-signing@clementine-data.iam.gserviceaccount.com
      - name: Set up gcloud
        if: steps.signing.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Set up Ruby
        if: steps.signing.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1
        with:
          # Pinned (rather than relying on whatever the runner image ships)
          # so it always matches the Ruby that generated Gemfile.lock.
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Install signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          FASTLANE_TEAM_ID: ${{ vars.FASTLANE_TEAM_ID }}
        run: dist/setup_signing.sh

      - name: cmake
        working-directory: bin
        run: |
          BREW_PREFIX="$(brew --prefix)"
          cmake .. \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBGPOD=OFF \
            -DCMAKE_PREFIX_PATH="${BREW_PREFIX}/opt/qt" \
            -DGETTEXT_MSGMERGE_EXECUTABLE="${BREW_PREFIX}/opt/gettext/bin/msgmerge" \
            -DGETTEXT_MSGFMT_EXECUTABLE="${BREW_PREFIX}/opt/gettext/bin/msgfmt" \
            -DGETTEXT_XGETTEXT_EXECUTABLE="${BREW_PREFIX}/opt/gettext/bin/xgettext" \
            ${APPLE_DEVELOPER_ID:+-DAPPLE_DEVELOPER_ID="$APPLE_DEVELOPER_ID"} \
            ${APPLE_NOTARIZE_API_KEY_PATH:+-DAPPLE_NOTARIZE_API_KEY_PATH="$APPLE_NOTARIZE_API_KEY_PATH"}
      - name: Copy icon files and resources
        working-directory: bin
        run: make install
      - name: Build DMG
        working-directory: bin
        run: make dmg -j$(sysctl -n hw.ncpu)
      - name: Notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        working-directory: bin
        run: make notarize-dmg
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release_mac
          path: bin/clementine-*.dmg
