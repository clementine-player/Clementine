name: all
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: clang-format
        uses: clementine-player/clang-format-lint-action@master
        with:
          style: "{BasedOnStyle: Google, DerivePointerBinding: false, Standard: Cpp11}"
          source: ./src
          clangFormatVersion: 9


  push_translations:
    name: Push translation sources to Transifex
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - uses: supplypike/setup-bin@v3
        with:
          uri: https://github.com/transifex/cli/releases/download/v1.6.17/tx-linux-amd64.tar.gz
          name: tx
          version: 1.6.17
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y
          build-essential
          cmake
          gettext
          git
          libasound2-dev
          libboost-dev
          libcdio-dev
          libchromaprint-dev
          libdbus-1-dev
          libfftw3-dev
          libglew-dev
          libglib2.0-dev
          libgpod-dev
          libgstreamer-plugins-base1.0-dev
          libgstreamer1.0-dev
          liblastfm5-dev
          libmtp-dev
          libprotobuf-dev
          libpulse-dev
          libqt5x11extras5-dev
          libsqlite3-dev
          libtag1-dev
          pkg-config
          protobuf-compiler
          python3-pip
          qtbase5-dev
          qttools5-dev-tools
          qttools5-dev
          libsparsehash-dev
          ssh
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: tx init
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx init
      - name: cmake
        working-directory: bin
        run: cmake ..
      - name: make
        working-directory: bin
        run: make -j2
      - name: tx config
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx add --organization davidsansome --project clementine --resource clementineplayer --file-filter 'src/translations/<lang>.po' --type PO src/translations/en.po
      - name: tx push
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx push -s

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    needs:
      - build_bookworm_64
      - build_trixie_64
      - build_fedora_42
      - build_fedora_43
      - build_jammy_64
      - build_noble_64
      - build_resolute_64
      - build_mac
      - build_mingw
      - build_source
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release_artifacts
      - name: Create draft pre-release
        id: tag_name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION=$(echo release_artifacts/**/*.tar.xz | sed -e 's/.*clementine-\(.*\).tar.xz/\1/')
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create draft pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.tag_name.outputs.version }}
          tag_name: ${{ steps.tag_name.outputs.version }}
          files: "release_artifacts/**/*"
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  build_source:
    name: Build source tarball
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y
          cmake
          fakeroot
          gettext
          git
          libasound2-dev
          libboost-dev
          libboost-serialization-dev
          libcdio-cdda2
          libcdio-dev
          libchromaprint-dev
          libcrypto++-dev
          libdbus-1-dev
          libfftw3-dev
          libglew-dev
          libgpod-dev
          libgstreamer-plugins-base1.0-dev
          libgstreamer1.0-dev
          liblastfm5-dev
          libmtp-dev
          libmygpo-qt-dev
          libplist-dev
          libprotobuf-dev
          libpulse-dev
          libqca-qt5-2-dev
          libqca-qt5-2-plugins
          libqt5x11extras5-dev
          libsparsehash-dev
          libsqlite3-dev
          libtag1-dev
          libusbmuxd-dev
          protobuf-compiler
          qtbase5-dev
          qttools5-dev-tools
          qttools5-dev
          ssh
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: cmake
        working-directory: bin
        run: cmake ..
      - name: Build source tarball
        working-directory: bin
        run: ../dist/maketarball.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release_source
          path: bin/clementine-*.tar.xz

  build_fedora_42:
    name: Build Fedora 42 RPM
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    env:
      RPM_BUILD_NCPUS: "2"
    steps:
      - name: Install dependencies
        run: >
          dnf install --assumeyes
          @development-tools
          alsa-lib-devel
          boost-devel
          cmake
          cryptopp
          cryptopp-devel
          dbus-devel
          desktop-file-utils
          fftw-devel
          gcc-c++
          gettext
          git
          glew-devel
          gstreamer1-devel
          gstreamer1-plugins-base-devel
          hicolor-icon-theme
          libappstream-glib
          libcdio-devel
          libchromaprint-devel
          libgpod-devel
          liblastfm-qt5-devel
          libmtp-devel
          libnotify-devel
          openssh
          pkgconfig
          protobuf-compiler
          protobuf-devel
          pulseaudio-libs-devel
          qca-qt5-devel
          qca-qt5-ossl
          qt5-linguist
          qt5-qtbase-devel
          qt5-qtx11extras-devel
          qt5-rpm-macros
          qtsingleapplication-qt5-devel
          qtsinglecoreapplication-qt5-devel
          rpmdevtools
          sparsehash-devel
          sqlite-devel
          taglib-devel
          tar
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: git hackery
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: cmake
        working-directory: bin
        run: cmake -DUSE_SYSTEM_QTSINGLEAPPLICATION=On ..
      - name: Build source tarball
        working-directory: bin
        run: ../dist/maketarball.sh
      - name: Create rpmbuild directory
        run: mkdir -p ~/rpmbuild/SOURCES
      - name: Move source tarball
        working-directory: bin
        run: mv clementine-*.tar.xz ~/rpmbuild/SOURCES
      - name: Build RPM
        working-directory: bin
        run: rpmbuild -ba ../dist/clementine.spec
      - uses: actions/upload-artifact@v4
        with:
          name: release_fedora_42
          path: ~/rpmbuild/RPMS/*/clementine-*.rpm

