  build_mingw:
    name: Build Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # windows-latest has dropped NSIS from its preinstalled software list
      # on some recent runner images, so install it explicitly rather than
      # relying on it being there.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # The choco package doesn't register makensis on PATH itself, so
          # do it here - GITHUB_PATH additions apply to every later step in
          # the job regardless of which shell that step uses.
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found under $nsisDir after choco install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-chromaprint
            mingw-w64-x86_64-libcdio
            mingw-w64-x86_64-sparsehash
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-gst-plugins-ugly
            mingw-w64-x86_64-gst-libav

      # These aren't confirmed to exist as MSYS2 mingw64 packages (libmtp in
      # particular). Failing softly here just means CMake's optional_component
      # machinery disables the corresponding feature instead of failing the
      # whole build - see the job summary in the PR/commit this came from.
      # libgpod isn't attempted at all: it's not packaged for MSYS2 mingw64,
      # so iPod classic support is disabled on this build variant for now.
      # (Last.fm scrobbling talks directly to the web service API now - see
      # src/internet/lastfm/lastfmws.* - so it needs no package here at all.)
      - name: Install optional dependencies (best-effort)
        run: pacman --noconfirm -S --needed mingw-w64-x86_64-libmtp || true

      - name: git hackery
        run: git config --global --add safe.directory "$(cygpath -u "$GITHUB_WORKSPACE")"

      - name: Download projectM presets
        run: |
          git clone --depth=1 https://github.com/projectM-visualizer/presets-cream-of-the-crop \
            3rdparty/libprojectm/presets-cream
          rm -rf 3rdparty/libprojectm/presets-cream/.git
          rm -f 3rdparty/libprojectm/presets-cream/LICENSE.md \
            3rdparty/libprojectm/presets-cream/README.md

      - name: cmake
        working-directory: bin
        run: >
          cmake .. -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: build
        working-directory: bin
        run: cmake --build .

      - name: Copy output exes
        working-directory: dist/windows
        run: cp ../../bin/*.exe .

      # Direct + transitive linked DLL dependencies are discovered from the
      # built binaries themselves rather than hardcoded by name/version, since
      # exact mingw64 package sonames drift with every MSYS2 update. This
      # doesn't catch plugins loaded via dlopen() at runtime (Qt platform
      # plugins, GStreamer elements, GIO modules) - those are copied
      # separately below, same as the old pipeline did.
      - name: Collect runtime DLL dependencies
        working-directory: dist/windows
        run: |
          set -x
          which ntldd
          ls -la
          : > raw_deps.txt
          for exe in *.exe; do
            echo "== ntldd -R $exe =="
            ntldd -R "$exe" >> raw_deps.txt 2>&1 \
              || echo "ntldd exited non-zero for $exe (continuing, see output above/below)"
          done
          echo "---- raw ntldd output ----"
          cat raw_deps.txt
          # ntldd prints native Windows paths (backslash-separated, drive
          # letter, e.g. D:\a\_temp\msys64\mingw64\bin\libfoo.dll) rather than
          # the /mingw64/... POSIX path - match on "mingw64\bin" or
          # "mingw64/bin" regardless of separator, then re-resolve each hit
          # against the canonical POSIX /mingw64/bin path rather than passing
          # the raw backslash path to cp.
          grep '=>' raw_deps.txt | awk '{print $3}' \
            | grep -i 'mingw64[\\/]bin[\\/]' \
            | sed 's/^.*[\\/]//' \
            | sort -u > mingw_deps.txt || true
          echo "---- mingw64 DLLs to bundle ----"
          cat mingw_deps.txt
          if [ ! -s mingw_deps.txt ]; then
            echo "::error::No mingw64 DLL dependencies were resolved - ntldd likely isn't finding the exes' dependencies. See raw ntldd output above." >&2
            exit 1
          fi
          while IFS= read -r name; do
            cp -n -v "/mingw64/bin/$name" .
          done < mingw_deps.txt
          rm -f raw_deps.txt mingw_deps.txt

      - name: Copy Qt plugin DLLs
        working-directory: dist/windows
        run: |
          set -e
          mkdir -p platforms styles imageformats tls
          cp /mingw64/share/qt6/plugins/platforms/qwindows.dll platforms/
          # Qt6 replaced the old per-style qwindowsvistastyle.dll plugin with
          # a single qmodernwindowsstyle.dll that covers both the
          # "windowsvista" and "windows11" styles.
          cp /mingw64/share/qt6/plugins/styles/qmodernwindowsstyle.dll styles/
          cp /mingw64/share/qt6/plugins/imageformats/qgif.dll \
             /mingw64/share/qt6/plugins/imageformats/qjpeg.dll \
             /mingw64/share/qt6/plugins/imageformats/qsvg.dll \
             imageformats/
          # Qt6 moved TLS support out of QtNetwork and into a plugin.
          # qschannelbackend uses Windows' native Secure Channel, so unlike
          # the qopensslbackend alternative it needs no separate OpenSSL DLLs
          # bundled alongside it.
          cp /mingw64/share/qt6/plugins/tls/qschannelbackend.dll tls/

      - name: Copy GIO modules
        working-directory: dist/windows
        run: |
          mkdir -p gio-modules
          cp /mingw64/lib/gio/modules/libgiognutls.dll gio-modules/ || true

      - name: Copy GStreamer plugins
        working-directory: dist/windows
        run: |
          mkdir -p gstreamer-plugins
          cp /mingw64/lib/gstreamer-1.0/*.dll gstreamer-plugins/

      - name: Build Windows installer
        # makensis was installed via choco onto the Windows-wide PATH, not
        # the MSYS2 one (MSYS2's shell rebuilds its own minimal PATH rather
        # than inheriting the runner's), so run this step outside msys2.
        shell: pwsh
        run: makensis clementine.nsi
        working-directory: dist/windows

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release_mingw
          path: dist/windows/ClementineSetup*.exe

  build_bookworm_64:
    name: Build Debian Bookworm 64-bit deb
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
    steps:
      - name: Install dependencies
        run: >
          apt-get update && apt-get install -y
          build-essential
          cmake
          debhelper
          gettext
          git
          libasound2-dev
          libboost-dev
          libcdio-dev
          libchromaprint-dev
          libcrypto++-dev
          libdbus-1-dev
          libfftw3-dev
          libglew-dev
          libglib2.0-dev
          libgl1-mesa-dev
          libglx-dev
          libgpod-dev
