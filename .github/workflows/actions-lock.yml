# Checks that .github/workflows/actions.lock pins every action the workflows
# use, directly or through other actions, to a commit that still verifies
# upstream. GitHub runs the locked commits, so a tag that's moved since can't
# change what runs. See
# https://docs.github.com/en/actions/concepts/security/workflow-dependency-lockfiles
#
# After changing a workflow's `uses:`, update the lockfile with
#   gh extension install github/gh-actions-lock
#   gh actions-lock
# and commit it with the change. If this check fails, its log ends with the
# patch that does that, which is also kept as the actions-lock-fix artifact.
name: actions-lock

on:
  push:
    branches:
      - master
  # Into any branch, so that stacked pull requests are checked too.
  pull_request:
  # Catches a locked tag that's been moved upstream.
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify
        run: gh actions-lock --verify
      - name: Show the fix
        if: failure()
        run: |
          gh actions-lock || true
          git add --intent-to-add .github/workflows/actions.lock || true
          git diff > actions-lock-fix.patch
          cat actions-lock-fix.patch
      - name: Keep the fix
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: actions-lock-fix
          path: actions-lock-fix.patch
          if-no-files-found: ignore
