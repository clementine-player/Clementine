// The message Cast senders and receivers exchange. The field numbers and
// types have to match what Cast devices speak; the names don't go on the
// wire.

syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package cpb.cast;

message CastMessage {
  enum ProtocolVersion {
    CASTV2_1_0 = 0;
  }
  required ProtocolVersion protocol_version = 1;

  required string source_id = 2;
  required string destination_id = 3;

  // eg. "urn:x-cast:com.google.cast.tp.heartbeat".
  required string namespace = 4;

  enum PayloadType {
    STRING = 0;
    BINARY = 1;
  }
  required PayloadType payload_type = 5;

  // JSON, in every namespace Clementine uses.
  optional string payload_utf8 = 6;
  // Only used for device authentication.
  optional bytes payload_binary = 7;
}
